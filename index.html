<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雷霆1942 | 空戰射擊</title><style>*{box-sizing:border-box}body{margin:0;background:#081321;color:#e8f6ff;font-family:system-ui,'Microsoft JhengHei',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.wrap{text-align:center;width:min(96vw,520px)}h1{margin:8px 0;color:#75e7ff;letter-spacing:3px}p{margin:6px 0 12px;font-size:13px;color:#b4c8da}canvas{display:block;width:100%;aspect-ratio:3/4;border:2px solid #4f91b5;border-radius:12px;background:#102a41;touch-action:none;box-shadow:0 0 30px #116b9344}.bar{display:flex;justify-content:space-between;gap:6px;margin:10px 0;font-size:14px}.bar span{background:#16334c;border-radius:8px;padding:8px;flex:1}button{background:#18a9ce;color:white;border:0;border-radius:9px;padding:11px 22px;font-weight:bold;cursor:pointer;margin:4px}button:hover{background:#25c7ef}.tip{font-size:12px;color:#8eafc3}</style></head><body><div class="wrap"><h1>✦ 雷霆戰機 V3.0 ✦</h1><p>現代戰機 · 追蹤飛彈 · 三大戰場 · 多階段 BOSS</p><div class="bar"><span id="score">分數 0</span><span id="life">生命 ♥♥♥</span><span id="level">關卡 1</span><span id="bombs">炸彈 3</span><span id="scene">海洋</span></div><canvas id="game" width="480" height="640" aria-label="射擊遊戲畫面"></canvas><button id="start">開始遊戲 / 重新開始</button><button id="pause">暫停</button><button id="bomb">💥 炸彈</button><button id="weapon">切換武器</button><button id="sound">🔊 音效開</button><p class="tip">電腦：方向鍵或 WASD 移動，空白鍵暫停、Z 炸彈、X 切換武器（機砲／散彈／雷射／追蹤飛彈） ｜ 手機：拖曳戰機、點擊按鈕</p></div><script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height;let state='ready',score=0,lives=3,level=1,t=0,last=0,spawn=0,bossMade=false,shake=0,bombs=3,weapon=0,flash=0,missiles=[],terrain=[],soundOn=true,audio=null,bgmClock=0;let player,bullets=[],enemies=[],enemyBullets=[],particles=[],items=[],stars=[];const keys=new Set();const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function ensureAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){soundOn=false}}function playSound(freq,duration,type='sine',vol=.04){if(!soundOn||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.6),now+duration);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+duration)}catch(e){}}function drawTerrain(){let scene=(level-1)%3,scroll=t*95;x.save();if(scene===0){x.fillStyle='#146078';x.fillRect(0,0,W,H);for(let i=0;i<17;i++){let y=((i*83+scroll*.7)%(H+100))-60;x.strokeStyle='#ffffff16';x.lineWidth=2;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(130,y-30,300,y+30,W,y);x.stroke()}for(let i=0;i<6;i++){let y=((i*190+scroll*.48)%(H+220))-100;x.fillStyle='#347e70';x.beginPath();x.ellipse(i%2?35:445,y,55,100,0,0,Math.PI*2);x.fill()}}else if(scene===1){x.fillStyle='#293e51';x.fillRect(0,0,W,H);for(let row=-1;row<8;row++)for(let col=0;col<6;col++){let y=((row*115+scroll)%(H+120))-115,px=col*88+8;x.fillStyle=(row+col)%3===0?'#506475':'#3a5265';x.fillRect(px,y,68,78);x.fillStyle='#8bb1bd';for(let j=0;j<3;j++)for(let k=0;k<3;k++)x.fillRect(px+10+j*18,y+10+k*20,7,8)}x.fillStyle='#192b3a';x.fillRect(230,0,28,H)}else{x.fillStyle='#4b5c4b';x.fillRect(0,0,W,H);x.fillStyle='#68716a';x.fillRect(165,0,150,H);x.strokeStyle='#d8d7ac';x.lineWidth=4;x.setLineDash([35,28]);x.beginPath();x.moveTo(240,-70+scroll%63);x.lineTo(240,H+70);x.stroke();x.setLineDash([]);for(let i=0;i<12;i++){let y=((i*87+scroll)%(H+90))-50;x.fillStyle='#34473e';x.fillRect(i%2?20:380,y,65,38);x.fillStyle='#8c9c85';x.fillRect(i%2?29:389,y+8,45,8)}}x.restore()}function reset(){score=0;lives=3;level=1;t=0;spawn=0;bossMade=false;shake=0;bombs=3;weapon=0;flash=0;missiles=[];terrain=[];bullets=[];enemies=[];enemyBullets=[];particles=[];items=[];player={x:240,y:550,r:15,power:1,inv:0,fire:0};stars=Array.from({length:85},()=>({x:rand(0,W),y:rand(0,H),s:rand(1,3),v:rand(25,110)}));state='play';document.querySelector('#weapon').textContent='武器：機砲';hud()}function hud(){document.querySelector('#score').textContent='分數 '+score;document.querySelector('#life').textContent='生命 '+'♥'.repeat(Math.max(0,lives));document.querySelector('#level').textContent='關卡 '+level;document.querySelector('#bombs').textContent='炸彈 '+bombs;document.querySelector('#scene').textContent=['海洋','城市','軍事基地'][(level-1)%3]}function boom(px,py,color,n=18){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(35,180);particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.25,.7),color})}}function enemy(type){let boss=type==='boss',r=boss?48:type==='heavy'?23:16;enemies.push({x:boss?W/2:rand(r+12,W-r-12),y:-r-5,r,hp:boss?85:type==='heavy'?7:3,max:boss?85:type==='heavy'?7:3,v:boss?35:type==='heavy'?65+level*5:100+level*9,type,fire:rand(.7,2),phase:rand(0,7),value:boss?1500:type==='heavy'?160:70})}function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}function update(dt){if(state!=='play')return;t+=dt;bgmClock-=dt;if(bgmClock<=0){bgmClock=.35;const notes=[164,196,220,196,146,164,196,246];if(Math.floor(t/.35)%2===0)playSound(notes[Math.floor(t/.35)%notes.length],.17,'triangle',.013)}shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt*2);for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=rand(0,W)}}let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);let len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/len*270*dt,20,W-20);player.y=clamp(player.y+dy/len*270*dt,35,H-25);player.inv=Math.max(0,player.inv-dt);player.fire-=dt;if(player.fire<=0){player.fire=.14;let offsets=weapon===3?[]:weapon===1?[-24,-12,0,12,24]:weapon===2?[-8,8]:player.power>=3?[-15,0,15]:player.power===2?[-10,10]:[0];for(let o of offsets)bullets.push({x:player.x+o,y:player.y-20,vx:weapon===1?o*3:weapon===2?0:o*.5,vy:weapon===2?-650:-490,r:weapon===2?7:4,damage:weapon===2?3:1});if(weapon===3&&Math.floor(t*8)%2===0){let target=enemies.filter(e=>e.y>0).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];missiles.push({x:player.x,y:player.y-18,vx:0,vy:-260,r:7,damage:4,target,trail:[]});playSound(520,.08,'sawtooth',.035)}else if(Math.random()<.25)playSound(weapon===2?680:420,.035,'square',.018)}let stage=Math.floor(score/2200)+1;if(stage>level){level=stage;bossMade=false;hud()}spawn-=dt;if(spawn<=0){enemy(Math.random()<.2?'heavy':'normal');spawn=Math.max(.32,.95-level*.055)}if(score>0&&score%2200>=1200&&!bossMade){enemy('boss');bossMade=true}for(const m of missiles){if(m.target&&!m.target.dead&&m.target.hp>0){let a=Math.atan2(m.target.y-m.y,m.target.x-m.x);m.vx+=(Math.cos(a)*340-m.vx)*Math.min(1,dt*5);m.vy+=(Math.sin(a)*340-m.vy)*Math.min(1,dt*5)}m.x+=m.vx*dt;m.y+=m.vy*dt;m.trail.push({x:m.x,y:m.y});if(m.trail.length>9)m.trail.shift();for(const e of enemies){if(!e.dead&&hit(m,e)){e.hp-=m.damage;m.dead=true;boom(m.x,m.y,'#ffbb64',12);break}}}missiles=missiles.filter(m=>!m.dead&&m.x>-30&&m.x<W+30&&m.y>-30&&m.y<H+30);for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}bullets=bullets.filter(b=>b.y>-20);for(const e of enemies){e.phase+=dt;e.y+=e.v*dt;if(e.type==='boss'){e.x=W/2+Math.sin(e.phase*(e.hp<e.max*.5?1.8:1))*135;e.y=Math.min(95,e.y)}else e.x+=Math.sin(e.phase*2)*28*dt;e.fire-=dt;if(e.fire<=0&&e.y>0&&e.y<H-80){let a=Math.atan2(player.y-e.y,player.x-e.x),count=e.type==='boss'?(e.hp<e.max*.5?9:5):1;for(let j=0;j<count;j++){let angle=a+(j-(count-1)/2)*(e.type==='boss'&&e.hp<e.max*.5?.28:.22);enemyBullets.push({x:e.x,y:e.y+e.r,vx:Math.cos(angle)*145,vy:Math.sin(angle)*145,r:5})}e.fire=e.type==='boss'?(e.hp<e.max*.5?.48:.8):rand(1.6,3)}}for(const b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt}enemyBullets=enemyBullets.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20);for(const e of enemies){for(const b of bullets){if(!b.dead&&hit(e,b)){b.dead=true;e.hp-=b.damage;boom(b.x,b.y,'#ffe48b',3)}}if(e.hp<=0&&!e.dead){e.dead=true;score+=e.value;boom(e.x,e.y,e.type==='boss'?'#ff6c4a':'#ffb15b',e.type==='boss'?70:22);shake=e.type==='boss'?10:3;playSound(e.type==='boss'?80:140,e.type==='boss'?.6:.14,'sawtooth',.08);if(Math.random()<(e.type==='boss'?1:.16))items.push({x:e.x,y:e.y,r:12,v:90,kind:Math.random()<.25?'bomb':'power'});hud()}if(!e.dead&&player.inv<=0&&hit(e,player)){e.dead=true;boom(e.x,e.y,'#ff9944');damage()}}bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead&&e.y<H+80);for(const b of enemyBullets){if(player.inv<=0&&hit(b,player)){b.dead=true;damage()}}enemyBullets=enemyBullets.filter(b=>!b.dead);for(const p of items){p.y+=p.v*dt;if(hit(p,player)){p.dead=true;if(p.kind==='bomb')bombs=Math.min(9,bombs+1);else player.power=Math.min(3,player.power+1);score+=100;hud()}}items=items.filter(p=>!p.dead&&p.y<H+20);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}function damage(){playSound(110,.32,'sawtooth',.1);lives--;player.inv=2;shake=12;boom(player.x,player.y,'#60dfff',25);hud();if(lives<=0)state='over'}function plane(px,py,color,scale=1,enemy=false){x.save();x.translate(px,py);x.scale(scale,scale);if(enemy)x.rotate(Math.PI);x.fillStyle=color;x.beginPath();x.moveTo(0,-20);x.lineTo(8,-4);x.lineTo(25,6);x.lineTo(25,13);x.lineTo(7,10);x.lineTo(6,20);x.lineTo(-6,20);x.lineTo(-7,10);x.lineTo(-25,13);x.lineTo(-25,6);x.lineTo(-8,-4);x.closePath();x.fill();x.fillStyle='#d9faff';x.beginPath();x.moveTo(0,-10);x.lineTo(5,6);x.lineTo(-5,6);x.fill();x.fillStyle='#314b65';x.fillRect(-20,8,9,3);x.fillRect(11,8,9,3);x.fillStyle='#f8c95a';x.fillRect(-3,17,6,7);x.restore()}function draw(){x.save();x.clearRect(0,0,W,H);let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a2239');bg.addColorStop(1,'#14516b');x.fillStyle=bg;x.fillRect(0,0,W,H);drawTerrain();x.fillStyle='#a3dff7';for(const s of stars){x.globalAlpha=.2+s.s/5;x.fillRect(s.x,s.y,s.s,s.s*2)}x.globalAlpha=1;if(shake)x.translate(rand(-shake,shake),rand(-shake,shake));for(const b of bullets){x.fillStyle=weapon===2?'#ff62fc':weapon===1?'#f8ec75':'#82f9ff';x.shadowColor=x.fillStyle;x.shadowBlur=14;x.fillRect(b.x-b.r,b.y-13,b.r*2,22)}x.shadowBlur=0;for(const e of enemies){plane(e.x,e.y,e.type==='boss'?'#ed5860':e.type==='heavy'?'#e6a55c':'#d65e6d',e.type==='boss'?2.2:e.type==='heavy'?1.1:.8,true);if(e.type==='boss'){x.fillStyle='#471e31';x.fillRect(e.x-65,e.y-75,130,8);x.fillStyle=e.hp<e.max*.5?'#ffe35e':'#ff7777';x.fillRect(e.x-65,e.y-75,130*Math.max(0,e.hp)/e.max,8);if(e.hp<e.max*.5){x.fillStyle='#fff';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText('第二階段',e.x,e.y-85)}}}for(const m of missiles){x.strokeStyle='#ffb655';x.lineWidth=4;x.beginPath();m.trail.forEach((p,i)=>{if(i===0)x.moveTo(p.x,p.y);else x.lineTo(p.x,p.y)});x.stroke();x.fillStyle='#ffe9a4';x.beginPath();x.arc(m.x,m.y,5,0,Math.PI*2);x.fill()}for(const b of enemyBullets){x.fillStyle='#ffbd61';x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill()}for(const p of items){x.fillStyle=p.kind==='bomb'?'#ffb15b':'#55e9a3';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.fillStyle='#053f31';x.font='bold 17px sans-serif';x.textAlign='center';x.fillText(p.kind==='bomb'?'B':'P',p.x,p.y+6)}for(const p of particles){x.globalAlpha=Math.min(1,p.life*2);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)}x.globalAlpha=1;if(player&&(state!=='over'||true)){if(player.inv<=0||Math.floor(t*12)%2===0)plane(player.x,player.y,'#57d7f0',1.05)}x.restore();if(flash>0){x.fillStyle='rgba(255,255,255,'+(flash*.45)+')';x.fillRect(0,0,W,H)}if(state!=='play'){x.fillStyle='#061625cc';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='bold 38px sans-serif';x.fillText(state==='over'?'遊戲結束':state==='pause'?'已暫停':'雷霆戰機 V3.0',W/2,270);x.font='19px sans-serif';x.fillText(state==='over'?'最終得分：'+score:state==='pause'?'按空白鍵繼續':'按下「開始遊戲」出擊！',W/2,315)}}function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}function useBomb(){playSound(75,.7,'sawtooth',.15);if(state!=='play'||bombs<=0)return;bombs--;flash=1;shake=16;enemyBullets=[];for(const e of enemies){e.hp-=e.type==='boss'?35:999;boom(e.x,e.y,'#ffe48b',12)}hud()}function changeWeapon(){weapon=(weapon+1)%4;document.querySelector('#weapon').textContent=['武器：機砲','武器：散彈','武器：雷射','武器：追蹤飛彈'][weapon]}function toggle(){if(state==='play')state='pause';else if(state==='pause')state='play'}document.querySelector('#start').onclick=()=>{ensureAudio();reset()};document.querySelector('#pause').onclick=toggle;document.querySelector('#bomb').onclick=useBomb;document.querySelector('#weapon').onclick=changeWeapon;document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;document.querySelector('#sound').textContent=soundOn?'🔊 音效開':'🔇 音效關';if(soundOn)ensureAudio()};addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!e.repeat)toggle();if(e.key.toLowerCase()==='z'&&!e.repeat)useBomb();if(e.key.toLowerCase()==='x'&&!e.repeat)changeWeapon();keys.add(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase()));function touch(e){if(state!=='play')return;const r=c.getBoundingClientRect();player.x=clamp((e.clientX-r.left)*W/r.width,20,W-20);player.y=clamp((e.clientY-r.top)*H/r.height,35,H-25)}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);touch(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')touch(e)});requestAnimationFrame(loop)})();
</script></body></html>
